name: Registry Update Check

on:
  schedule:
    - cron: '0 16 * * *'
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: registry-check
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: converter/package-lock.json
      - name: Fetch registry
        run: |
          rm -rf coc-vscode-registry
          git clone --depth 1 --single-branch https://github.com/coc-plugin/coc-vscode-registry.git coc-vscode-registry
      - name: Install converter dependencies
        run: npm ci
        working-directory: converter
      - id: gen
        name: Generate check matrix
        run: |
          MATRIX=$(npx tsx ../.github/scripts/generate-matrix.ts)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
        working-directory: converter

  check:
    needs: discover
    if: ${{ needs.discover.result == 'success' && needs.discover.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
      max-parallel: 8
    env:
      ENTRY_NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: converter/package-lock.json
      - name: Cache source repos
        uses: actions/cache@v6
        with:
          path: ~/.cache/coc-converter-smoke
          key: smoke-cache-${{ hashFiles('converter/src/**') }}
          restore-keys: smoke-cache-
      - name: Fetch registry
        run: |
          rm -rf coc-vscode-registry
          git clone --depth 1 --single-branch https://github.com/coc-plugin/coc-vscode-registry.git coc-vscode-registry
      - name: Install converter dependencies
        run: npm ci
        working-directory: converter
      - name: Check entry for updates
        run: npx tsx ../.github/scripts/registry-check-entry.ts
        working-directory: converter
        env:
          GIT_AUTHOR_NAME: coc-vscode-loader[bot]
          GIT_AUTHOR_EMAIL: bot@coc-vscode-loader
          GIT_COMMITTER_NAME: coc-vscode-loader[bot]
          GIT_COMMITTER_EMAIL: bot@coc-vscode-loader
          # Use PAT (REGISTRY_CHECK_PAT) to create PRs that trigger CI.
          # Falls back to GITHUB_TOKEN if not configured.
          GH_TOKEN: ${{ secrets.REGISTRY_CHECK_PAT || secrets.GITHUB_TOKEN }}
