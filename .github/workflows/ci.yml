name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: converter/package-lock.json

      - name: Fetch registry
        run: git clone --depth 1 --single-branch https://github.com/coc-plugin/coc-vscode-registry.git coc-vscode-registry

      - name: Install dependencies
        run: npm ci
        working-directory: converter

      - name: Check test coverage + run tests
        run: npm test
        working-directory: converter

  diff:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: converter/package-lock.json

      - name: Fetch registry
        run: git clone --depth 1 --single-branch https://github.com/coc-plugin/coc-vscode-registry.git coc-vscode-registry

      - name: Cache source repos
        uses: actions/cache@v6
        with:
          path: ~/.cache/coc-converter-smoke
          key: smoke-cache-${{ hashFiles('converter/src/**') }}
          restore-keys: smoke-cache-

      - name: Install dependencies
        run: npm ci
        working-directory: converter

      - name: Verify baseline integrity (detect unintended side effects)
        run: npm run diff:check -- --verbose
        working-directory: converter

  smoke:
    needs: diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: converter/package-lock.json

      - name: Fetch registry
        run: git clone --depth 1 --single-branch https://github.com/coc-plugin/coc-vscode-registry.git coc-vscode-registry

      - name: Cache smoke repos
        uses: actions/cache@v6
        with:
          path: ~/.cache/coc-converter-smoke
          key: smoke-cache-${{ hashFiles('converter/src/**') }}
          restore-keys: smoke-cache-

      - name: Install dependencies
        run: npm ci
        working-directory: converter

      - name: Run registry smoke test
        run: npm run test:smoke
        working-directory: converter
