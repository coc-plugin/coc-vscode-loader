name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: converter/package-lock.json

      - name: Fetch registry
        run: |
          git clone --depth 1 --single-branch https://github.com/coc-plugin/coc-vscode-registry.git coc-vscode-registry

      - name: Install dependencies
        run: npm ci
        working-directory: converter

      - name: Check test coverage
        run: npm run check:tests
        working-directory: converter

      - name: Run unit tests
        run: npm test
        working-directory: converter
